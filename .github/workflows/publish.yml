name: Publish to npm

on:
  release:
    types: [published]
    
permissions:
  id-token: write
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm publish --no-git-checks